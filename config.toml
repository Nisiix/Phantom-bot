# ─────────────────────────────────────────────────────────────────────────────
#  PHANTOM DESK — configuration
#
#  You never need to touch code. Everything tunable lives here.
#  The user's core rules are ALSO hard-coded as ceilings in desk/config.py:
#  you can make them stricter here, never looser. (e.g. setting
#  max_position_pct = 20 is silently clamped back to 8.)
# ─────────────────────────────────────────────────────────────────────────────

# "paper" = simulated fills against real live quotes (no money at risk)
# "live"  = real on-chain swaps. Requires the paper track record gate below,
#           a wallet key in .env and LIVE_CONFIRM=I_ACCEPT_THE_RISK in .env.
mode = "paper"

# Paper wallet starting balance (SOL). Ignored in live mode (the real wallet
# balance is used).
paper_starting_balance_sol = 10.0

# Where the database, logs and recaps live.
data_dir = "data"

[scout]
pumpportal = true            # real-time pump.fun launches + migrations (websocket)
geckoterminal = true         # new + trending pools on pump.fun / PumpSwap (and Raydium if venues = "all")
dexscreener = true           # newly listed / boosted Solana token profiles (polled)
venues = "pumpfun"           # "pumpfun" = only pump.fun tokens (bonding curve + PumpSwap)
                             # "all"     = also Raydium / LaunchLab / letsbonk / Meteora tokens
watch_minutes = 180          # how long a discovered token stays on the watchlist
recheck_seconds = 45         # how often watchlist tokens are re-sent to Filter
max_watchlist = 4000

[filter]
# ── the five mandatory kills (user rules) ──
require_mint_revoked = true
min_lp_locked_pct = 95.0      # LP burned or locked (bonding-curve tokens count as locked)
max_top10_pct = 20.0          # top-10 holders, excluding pools/bonding curve
min_volume_h1_usd = 50000.0   # last-hour volume across all pairs
reject_rug_linked_dev = true  # dev / dev funder connected to previous rugs
# ── extra capital-preservation kills ──
require_freeze_revoked = true      # freeze authority = can freeze your tokens (honeypot)
reject_dangerous_token2022 = true  # permanent delegate, transfer fees, non-transferable
reject_rugcheck_danger = true      # any "danger"-level RugCheck risk
min_liquidity_usd = 20000.0
serial_dev_min_launches = 3        # dev with >= N prior launches...
serial_dev_dead_ratio = 0.8        # ...of which >= 80% died (< $10k mcap) = rug-linked
# ── engine ──
deep_workers = 3                   # deep checks in parallel (RugCheck keeps its own rate limit)
deep_max_wait_seconds = 60         # drop queued deep checks whose market data got stale
# ── instant-rug guards (2026-11-10) ──
graduation_wait_minutes = 45       # no buy in the first N min after pump.fun -> PumpSwap graduation (0 = off)
early_release = true               # lift the wait early for a token steady since graduation, only if ALL hold:
early_release_min_minutes = 20     #   at least N min since graduation (instant rugs hit 5-26 min after it)
early_release_first_seen_minutes = 15  # watched from the start (first holder reading within N min of graduation)
early_release_min_readings = 3     #   at least N holder readings...
early_release_min_span_minutes = 10    # ...spanning N min; top10 never above max_top10_pct in any of them
early_release_max_dev_pct = 5.0    #   holders growing, liquidity >= 90% of first reading, dev holds <= N%
spread_top10_high_pct = 70.0       # top10 above this in the last spread_window_minutes and now under max_top10_pct
spread_window_minutes = 60         #   = supply spread across fake wallets -> token killed
rugged_name_days = 7               # relaunches of a name/symbol that rugged in the last N days are killed
rugged_name_loss_pct = 60.0        # our trade losing >= this within an hour marks its name as rugged

[analyst]
min_score = 0.65             # user rule: under 0.6 = no trade (can only be raised). 0.65: Controller proposal 2026-11-10
# Score weights (Controller proposal 2026-11-10, "promettente" on 82 tokens; remove the line to go back to the built-in ones)
weights = { liquidity = 0.13, turnover = 0.07, buy_pressure = 0.23, momentum = 0.06, holders = 0.07, hygiene = 0.04, website = 0.31, maturity = 0.10 }
website_check = true
# Claude reads the website and judges if it looks legit & "tasty".
# Used only when ANTHROPIC_API_KEY is set in .env.
claude_website_review = true
claude_model = "claude-opus-5-5"
workers = 3                  # tokens scored in parallel (one slow website no longer blocks the rest)

[executor]
max_position_pct = 8.0       # user rule: max 8% of current balance per trade (hard ceiling)
min_trade_sol = 0.05
max_open_positions = 4
slippage_bps = 300           # 3% max slippage on the swap
max_entry_price_impact_pct = 2.5
max_round_trip_loss_pct = 6.0   # buy+sell quote test: reject honeypots / heavy taxes
clearance_ttl_seconds = 120     # a Filter/Analyst clearance expires after this
fee_reserve_sol = 0.05          # live: always keep this much SOL for fees
priority_fee_max_lamports = 200000   # "rpc" execution only (Jupiter V2 sets fees itself)
# Live execution. "jupiter_v2": Jupiter Swap V2 order/execute (quote + transaction in one call, RTSE
# slippage, RFQ market makers, Jupiter lands it MEV-protected, exact fill returned). "rpc": legacy
# /swap/v1 sent through SOLANA_RPC_URL with our own fast rebroadcast loop (pair it with a private RPC).
execution = "jupiter_v2"
# Exit retries: if a sell fails it is retried IMMEDIATELY at these slippages (bps) to make sure we get out.
exit_slippage_ladder_bps = [800, 1500, 3000]

[risk]
hard_stop_pct = -4.0          # user rule: hard stop at -6% (can only be tightened). -4: Controller proposal 2026-11-10
trail_activate_pct = 25.0     # user rule: trailing starts only after +12% (25: Controller proposal 2026-11-10)
trail_distance_pct = 8.0      # trailing stop distance below the peak (8: Controller proposal 2026-11-10)
cooldown_after_loss_minutes = 20     # unused: after a loss only that token is blocked (forever), other pairs stay open
max_consecutive_losses = 3           # ...and a longer pause after a losing streak
streak_pause_minutes = 0               # 0 = no pause after a losing streak (set e.g. 30 to pause new buys after 3 losses in a row)
daily_loss_limit_pct = 30.0          # live only: halt new entries for the day after -30% equity (ignored in paper)
liquidity_drop_exit_pct = 35.0       # emergency exit if pool liquidity drops this much
max_hold_minutes = 45                # 0 = no time stop (45: Controller proposal 2026-11-10)
price_poll_seconds = 2.0

[recap]
interval_hours = 4

[live_gate]
# Live trading is refused until paper trading has proven itself.
min_paper_trades = 30
require_positive_paper_pnl = true
max_paper_drawdown_pct = 20.0

[quant]
# QUANT: trade only if expected value AFTER the measured round-trip cost is positive.
# Probabilities of "+12% first / -6% first / neither in 60 min" are learned from real trades
# and from following every evaluated token for 60 minutes (shadow tracking).
enabled = true
horizon_minutes = 60
min_samples_to_enforce = 30     # warm-up: log EV but don't block until this many outcomes exist
min_ev_pct = 0.0                # required edge in % (can only be >= 0)
prior_strength = 10.0
shadow_tracking = true          # follow every evaluated token (bought or skipped) for 60 min
shadow_weight = 0.5             # a skipped-token outcome counts half a real trade
shadow_min_liquidity_usd = 5000 # don't follow untradeable dust
default_cost_pct = 2.5          # assumed round-trip cost until real quotes have been measured
market_regime = true            # MEASUREMENT ONLY: store BTC / SOL / memecoin 1h & 24h moves with every
                                # shadow row and trade; `run.py research` compares outcomes by regime

[gmgn]
# Optional wallet intelligence from GMGN (paid OpenAPI, Plus plan or better).
# Active only when GMGN_API_KEY is set in .env. Read-only: GMGN never trades for this desk.
enabled = true
plan = "plus"                    # free | plus | pro  -> request budget
signal_feed = true               # Scout listens to smart-money & KOL buy signals
max_rug_ratio = 0.30             # GMGN rug label            -> permanent kill
max_insider_rate = 0.25          # suspected insider share   -> reject
max_bundler_rate = 0.30          # bundled-buy share         -> reject
max_sniper_rate = 0.30           # sniper share              -> reject
max_funding_cluster_pct = 15.0   # % supply held by wallets funded by the same wallet -> reject
serial_min_launches = 10         # dev with >= 10 launches and...
serial_max_graduation = 0.05     # ...<= 5% graduated -> permanent kill (and added to rug ledger)

[controller]
# CONTROLLORE: checks that the other agents behave (every health_seconds) and, every interval_minutes,
# replays different settings on the tokens the desk already followed for 60 minutes (no API calls, no trades).
# With auto_apply it APPLIES the improvements it finds by itself (never beyond the hard limits), records why
# (controller_decisions table, kept forever), re-checks each change on the tokens that come after it and rolls
# back what the new data disproves. Applied values: data/controller_overrides_<mode>.json, loaded over this file
# at every start (delete that file to go back to config.toml). Report: data/reports/controller_<mode>_latest.md,
# dashboard, `python run.py controller`.
enabled = true
interval_minutes = 10
health_seconds = 60
random_variants = 24      # new random combinations tried per agent each round (plus the best of earlier rounds)
min_rows = 30             # fewest tokens a situation needs before it is judged
holdout_pct = 30          # newest share of the data kept aside to verify the winner
lookback_days = 14
auto_apply = "always"     # applies by itself in paper AND live (user choice 2026-11-10) | "paper" = paper only | "off"
confirm_rounds = 3        # a PROMETTENTE result must win 3 rounds in a row before it is applied (SOLIDA: at once)
apply_cooldown_minutes = 60   # at most one change per agent per hour, so each effect can be measured
review_min_rows = 30      # new tokens needed to confirm an applied change or roll it back

[model]
# MODELLO: small statistical model (boosted trees, CPU, numpy) the Controller retrains every round on the 60-minute
# follow-ups. It estimates P(win) = chance that the current exit rules close a token in profit, from the numbers
# seen at decision time. Trained on the oldest 70%, judged on the newest 30% it never saw. It starts "in prova"
# (logs P(win), blocks nothing) and BLOCKS buys under its threshold only after a SOLIDA verdict (or PROMETTENTE for
# [controller] confirm_rounds rounds in a row) where auto_apply allows; it switches itself off when the advantage
# disappears. It can only block, never force a buy or loosen a rule. Data check: `python run.py model`.
enabled = true
enforce = true
min_rows = 1000           # Analyst follow-ups with stored values needed before the first training
min_leaf = 40
min_eval_rows = 30
max_block_pct = 40        # never block more than this share of the buys

[dashboard]
# Web dashboard (read-only) — opens in your browser at http://127.0.0.1:8080
enabled = true
port = 8080          # if busy, the next free port up to 8089 is used
open_browser = true

[pages]
# Public, read-only copy of the dashboard on GitHub Pages (https://<user>.github.io/<repo>/).
# The desk pushes a snapshot to the "gh-pages" branch every N minutes, in the background: if git or the
# network fail, the trading loop is not affected. ATTENTION: the page is PUBLIC (balances, trades, tokens).
enabled = true
interval_minutes = 10   # GitHub Pages accepts ~10 updates/hour: values below 6 are raised to 6
remote = ""             # empty = the "origin" remote of this folder (must be a git clone with push rights)
branch = "gh-pages"
publish_live = false    # in live mode publish only if true (trades are traceable to your wallet on-chain)
