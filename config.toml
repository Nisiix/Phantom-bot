# ─────────────────────────────────────────────────────────────────────────────
#  PHANTOM DESK — configuration
#
#  You never need to touch code. Everything tunable lives here.
#  The user's core rules are ALSO hard-coded as ceilings in desk/config.py:
#  you can make them stricter here, never looser. (e.g. setting
#  max_position_pct = 20 is silently clamped back to 8.)
# ─────────────────────────────────────────────────────────────────────────────

# "paper" = simulated fills against real live quotes (no money at risk)
# "live"  = real on-chain swaps. Requires the paper track record gate below,
#           a wallet key in .env and LIVE_CONFIRM=I_ACCEPT_THE_RISK in .env.
mode = "paper"

# Paper wallet starting balance (SOL). Ignored in live mode (the real wallet
# balance is used).
paper_starting_balance_sol = 10.0

# Where the database, logs and recaps live.
data_dir = "data"

[scout]
pumpportal = true            # real-time pump.fun launches + migrations (websocket)
geckoterminal = true         # new + trending pools on pump.fun / PumpSwap (and Raydium if venues = "all")
dexscreener = true           # newly listed / boosted Solana token profiles (polled)
venues = "pumpfun"           # "pumpfun" = only pump.fun tokens (bonding curve + PumpSwap)
                             # "all"     = also Raydium / LaunchLab / letsbonk / Meteora tokens
watch_minutes = 180          # how long a discovered token stays on the watchlist
recheck_seconds = 45         # how often watchlist tokens are re-sent to Filter
max_watchlist = 4000
# Second look: tokens dropped from the watchlist (window over or gone quiet) are re-read every
# revisit_seconds for revisit_hours; if they trade again they go back through Filter -> Analyst -> Risk.
# Permanent kills (rug, mint/freeze authority, holder spread, rugged names...) never come back.
revisit = true
revisit_hours = 24
revisit_seconds = 300
revisit_min_volume_usd = 10000
revisit_min_liquidity_usd = 10000
revisit_max = 5000

[filter]
# ── the five mandatory kills (user rules) ──
require_mint_revoked = true
min_lp_locked_pct = 95.0      # LP burned or locked (bonding-curve tokens count as locked)
max_top10_pct = 20.0          # top-10 holders, excluding pools/bonding curve
min_volume_h1_usd = 50000.0   # last-hour volume across all pairs
reject_rug_linked_dev = true  # dev / dev funder connected to previous rugs
# ── extra capital-preservation kills ──
require_freeze_revoked = true      # freeze authority = can freeze your tokens (honeypot)
reject_dangerous_token2022 = true  # permanent delegate, transfer fees, non-transferable
reject_rugcheck_danger = true      # any "danger"-level RugCheck risk
min_liquidity_usd = 20000.0
# Main pool currency (user rule 2026-11-12, after BERNIE: real pool against SPCX, a memecoin, plus dust SOL
# copies with made-up prices): the agent always buys in SOL, never on a pool quoted in another currency. [] = off.
allowed_quote_mints = ["So11111111111111111111111111111111111111112"]
# ── new tokens only (user's rule 2026-11-11: catch new, valid tokens that can still grow to ~$200k market cap or
# more; a token that already ran is out). Measured on 725 60-minute follow-ups (exit-study, 2026-11-11):
#   age  < 1 h: median best rise +40%, 24% reached +100%   | 1-3 days: +8%, 0%   | > 3 days: +4%, 4%
#   market cap < $200k: +40/+47%, 23-29% reached +100%     | $200-500k (after the Filter): +48%, 29%
#   $500k-1M: +6%                                          | > $1M: +5%, 3%
# So the ceiling sits at $500k, not $200k: tokens between $200k and $500k still ran like the smaller ones.
max_age_hours = 72.0               # token older than 3 days (since its oldest DEX pair): not considered. 0 = off
max_market_cap_usd = 500000.0      # market cap already above this: the first run is gone. 0 = off
serial_dev_min_launches = 3        # dev with >= N prior launches...
serial_dev_dead_ratio = 0.8        # ...of which >= 80% died (< $10k mcap) = rug-linked
# ── engine ──
deep_workers = 3                   # deep checks in parallel (RugCheck keeps its own rate limit)
deep_max_wait_seconds = 60         # drop queued deep checks whose market data got stale
# ── instant-rug guards (2026-11-10) ──
graduation_wait_minutes = 30       # no buy in the first N min after pump.fun -> PumpSwap graduation (0 = off). 30: user 2026-11-12 (was 45)
early_release = true               # lift the wait early for a token steady since graduation, only if ALL hold:
early_release_min_minutes = 20     #   at least N min since graduation (instant rugs hit 5-26 min after it)
early_release_first_seen_minutes = 15  # watched from the start (first holder reading within N min of graduation)
early_release_min_readings = 3     #   at least N holder readings...
early_release_min_span_minutes = 10    # ...spanning N min; top10 never above max_top10_pct in any of them
early_release_max_dev_pct = 5.0    #   holders growing, liquidity >= 90% of first reading, dev holds <= N%
spread_top10_high_pct = 70.0       # top10 above this in the last spread_window_minutes and now under max_top10_pct
spread_window_minutes = 60         #   = supply spread across fake wallets -> token killed
rugged_name_days = 7               # relaunches of a name/symbol that rugged in the last N days are killed
rugged_name_loss_pct = 60.0        # our trade losing >= this within an hour marks its name as rugged
# Real token or copycat (2026-11-11): same name as a rugged token is NOT a kill when the identity proves a
# different project. Points: contract address on its own website 2, DexScreener profile 1, own X account 1,
# website links that X account 1, visible Telegram +1 (optional, never a minus). Same dev wallet as the rugged token, or channels borrowed from it = blocked.
rugged_name_identity = true        # false = old rule (every name match killed)
identity_min_score = 3
identity_tg_min_members = 20       # linked Telegram group/channel that exists with >= N members: +1, optional extra: a hidden Telegram never counts against

[analyst]
min_score = 0.65             # user rule: under 0.6 = no trade (can only be raised). 0.65: Controller proposal 2026-11-10
# Score weights: applied by the Controller on 2026-11-11 20:00 UTC (decision #5, "promettente" on 42 tokens), kept
# by the user on 2026-11-12 and moved here from data/controller_overrides_paper.json. Remove the line for the built-in ones.
weights = { liquidity = 0.03, turnover = 0.03, buy_pressure = 0.28, momentum = 0.03, holders = 0.09, hygiene = 0.02, website = 0.51, maturity = 0.02 }
website_check = true
# Claude reads the website and judges if it looks legit & "tasty".
# Used only when ANTHROPIC_API_KEY is set in .env.
claude_website_review = true
claude_model = "claude-opus-5-5"
workers = 3                  # tokens scored in parallel (one slow website no longer blocks the rest)

[executor]
max_position_pct = 8.0       # user rule: max 8% of current balance per trade (hard ceiling)
min_trade_sol = 0.05
max_open_positions = 4
slippage_bps = 300           # 3% max slippage on the swap
max_entry_price_impact_pct = 2.5
max_round_trip_loss_pct = 6.0   # buy+sell quote test: reject honeypots / heavy taxes
clearance_ttl_seconds = 120     # a Filter/Analyst clearance expires after this
fee_reserve_sol = 0.05          # live: always keep this much SOL for fees
priority_fee_max_lamports = 200000   # "rpc" execution only (Jupiter V2 sets fees itself)
# Live execution. "jupiter_v2": Jupiter Swap V2 order/execute (quote + transaction in one call, RTSE
# slippage, RFQ market makers, Jupiter lands it MEV-protected, exact fill returned). "rpc": legacy
# /swap/v1 sent through SOLANA_RPC_URL with our own fast rebroadcast loop (pair it with a private RPC).
execution = "jupiter_v2"
# Pool & currency (2026-11-12): the buy goes through the pool the Filter/Analyst observed. If that pool trades
# against another currency (USDC, ...), Jupiter swaps SOL -> that currency -> token in ONE transaction (sells do
# the reverse, always ending in SOL). If Jupiter routes elsewhere, the quote is redone restricted to that pool's DEX;
# if it still can't use the pool, or the pool has < [filter] min_liquidity_usd or lost > [entry] max_liq_drop_pct
# since the analysis, no buy. Such a forced buy is sent via /swap/v1 + RPC in live (V2 orders can't be pinned).
# Exit retries: if a sell fails it is retried IMMEDIATELY at these slippages (bps) to make sure we get out.
exit_slippage_ladder_bps = [800, 1500, 3000]

[entry]
# ENTRY TIMING (2026-11-11): WHEN to buy a token the Analyst approved (desk/entry.py).
#   "now"     buy at once (as before)
#   "dip"     wait up to window_minutes for the price to be dip_pct % under the approval price
#   "bounce"  wait for that dip, then buy only when the price bounces bounce_pct % off its lowest point
#             (a dip that keeps falling is never bought)
#   "confirm" look again after confirm_minutes: buy only if the price is >= approval price + confirm_pct %
# fallback: what to do if the moment doesn't come in the window: "skip" (no trade) or "buy" (buy at that price).
# Waiting never skips a check: the buy still needs a fresh Filter + Analyst clearance, Risk, price impact,
# round-trip, QUANT. If liquidity drops max_liq_drop_pct % while waiting, the token is dropped (rug starting).
# The Controller ("Timing" agent) replays every rule on the 60-minute price paths of approved tokens and PROPOSES a
# switch when one beats the current one on data it never saw (it never switches by itself: rule 2026-11-11).
# Measured at launch on 42 approved tokens: waiting looked better on the older tokens, not on the newest ones,
# so it starts on "now" and the Controller decides as data comes in.
# USER'S TRIAL (2026-11-11 02:12 UTC): buy only on a 3% dip within 5 min of approval, else no trade.
# With trial_since set the Controller does not change this rule; it measures it against "buy at once" on the tokens
# approved since then and flags it "DA RIMUOVERE" (report + feed) if the newer data disproves it.
# To end the trial: mode = "now" and trial_since = "".
mode = "dip"
window_minutes = 5        # 1-15
dip_pct = 3.0
bounce_pct = 2.0
confirm_minutes = 5.0
confirm_pct = 0.0
fallback = "skip"
trial_since = "2026-11-11T02:15:00Z"
max_liq_drop_pct = 20.0
poll_seconds = 6.0        # price check of waiting tokens (one batched DexScreener call)

[risk]
# NO STOP AT A LOSS (user's rule 2026-11-11, paper AND live): while a position is at break-even or at a loss no stop
# sells it (no hard stop, no time exit). Only the profit stops sell (profit lock armed at +30%, the stop rising
# from +20% at 50% of the peak, 70% from +50%, the trailing from +50%). The emergency exits are off too (liquidity_drop_exit_pct = 0,
# data_loss_exit_seconds = 0): a rug is held to the end. true = back to hard_stop_pct / paper_hard_stop_pct and
# max_hold_minutes.
loss_stop = false
hard_stop_pct = -4.0          # user rule: hard stop at -6% (can only be tightened). -4: Controller proposal 2026-11-10
paper_hard_stop_pct = -25.0   # PAPER ONLY, user's choice 2026-11-11: trial of a stop wider than the -6% hard limit
                              # (Controller measure "Stop più larghi": -25% did +5.8 pts/token on 41 tokens, still uncertain).
                              # 0 = off. Live always uses hard_stop_pct (max -6%). Range -30..0.
trail_activate_pct = 50.0     # user rule: trailing starts only after +12% (50: user 2026-11-12, "under +50% the stop must
                              # be wider: at +50% the stop is +25%"; tighter only above, as before. Was 30.)
trail_distance_pct = 6.0      # trailing stop distance below the peak (6: Controller 2026-11-11, kept by the user 2026-11-12)
cooldown_after_loss_minutes = 20     # unused: after a loss only that token is blocked (forever), other pairs stay open
max_consecutive_losses = 3           # ...and a longer pause after a losing streak
streak_pause_minutes = 0               # 0 = no pause after a losing streak (set e.g. 30 to pause new buys after 3 losses in a row)
daily_loss_limit_pct = 30.0          # live only: halt new entries for the day after -30% equity (ignored in paper)
liquidity_drop_exit_pct = 0          # emergency exit if pool liquidity drops this much; 0 = off (user 2026-11-11)
data_loss_exit_seconds = 0           # emergency exit after N s with no price and no sell quote; 0 = off (user 2026-11-11)
max_hold_minutes = 0                 # 0 = no time stop (was 45; forced to 0 while loss_stop = false)
price_poll_seconds = 2.0
hot_poll_seconds = 1.0               # while a position is pumping (peak up 5+ points in the last minute): price
                                     # every second (the DexScreener positions lane allows 60 calls/min) and a
                                     # real Jupiter sell quote every ~3 s instead of 6-12 (risk lane: 30/min)
# PROFIT LOCK. User's rule 2026-11-11 (second version): avoid closing too early on the wide swings of the first
# hours after a launch. Arm only once the profit has covered the fees, and with fees under 3% around +7%; then the
# stop sits around +4%. Measured with `python run.py exit-study` on 42 price paths + real trades (2026-11-11 11:32
# UTC): every lock sale with a recorded path was followed by a much higher price (+20%, +28%, +82% within the hour);
# best safe setting: arm +8% net (+10% if reached within 3 min), sell at a FIXED +4% net: +1.4 pts/token vs the
# previous +8%/+6% (uncertain, [-0.8, +3.6]), no extra losing trade. A higher bar for young tokens added losers.
# NET = after buy fees, sale fees and sale slippage: every level is raised by the sell buffer (1% minimum; Risk
# uses the slippage it measured on its last stop exits when that is larger). The Controller keeps tuning it (never
# arming under +6%). It can never be turned off: base rule of the engine (user 2026-11-11).
# User 2026-11-12 (FLC sold at +3.8% net, ~$2.80, after a +12.1% peak): arm higher so small gains are not cut.
# Re-measured 2026-11-12 08:30 UTC on 57 Analyst price paths (14 days, no loss stop): arming +12% (+15% if reached
# within 3 min), still selling at +4%: +3.5 pts/token vs +8/+10 ([+0.5, +6.5]), no extra losing trade, 10 lock
# sales instead of 14 (4 fewer premature); approved tokens only (19): +2.5 ([-0.9, +5.9]). +20% gave the same mean
# with a worse worst-10%. Trade-off: a token that peaks between +8% and +12% and then falls is no longer sold.
# User 2026-11-12 (later the same morning): the first sale only after the price has gone past +30% and then falls to
# the stop. Replay 10:50 UTC (57 paths, current stops): arm +30% vs +12/+15 = approved tokens +0.26 pts/token
# ([-0.8, +1.3]), all tokens -2.9 ([-7.4, +1.7]), same losing trades. Once armed at +30% the stop keeps 60% of the
# peak (about +17%), 70% from +50% with the 6% trailing. The fast threshold equals it (no separate fast level).
profit_lock_activate_pct = 30.0
profit_lock_fast_activate_pct = 30.0
profit_lock_fast_minutes = 3.0
profit_lock_pct = 4.0
profit_lock_sell_buffer_pct = 1.0
# STOP THAT RISES WITH THE PRICE (user's rule 2026-11-11, for violent pumps): from a net peak of
# profit_lock_keep_from_pct the stop keeps profit_lock_keep_pct of the peak and follows it up, never down
# (+30% -> stop about +20%, +100% -> about +70%). The faster the peak rises, the larger the share: up to
# profit_lock_keep_fast_pct when it gains profit_lock_speed_full points per minute or more (measured over the
# last profit_lock_speed_seconds). Under profit_lock_keep_from_pct the stop stays at the fixed profit_lock_pct
# (a share of a small peak closed trades too early: measured). The trailing stop still applies: the higher of
# the two levels sells. keep_pct = 0 turns the share off, keep_fast_pct = 0 the speed part.
# Measured 2026-11-11 12:02 UTC (exit-study, 42 price paths): starting at +30% changes nothing on the approved
# tokens (the 8% trailing is already above it); starting at +20% with a 70% share: +0.85 pts/token on approved
# tokens, +1.13 on all ([-0.6, +2.8], uncertain), no extra losing trade; from +15% a bit more but more early
# exits; an 80% share was worse (-1.3). The speed part showed no gain on 20-second price samples (-0.1/-0.3,
# noise), so it is kept mild: 80% only on a violent rise (60 points per minute). The Controller keeps tuning.
profit_lock_keep_from_pct = 20.0
profit_lock_keep_pct = 70.0
# User 2026-11-12: on a fast rise lower the stop a little so a token that keeps climbing is left running (the
# trailing from +30% at 6% stays). Re-measured 2026-11-12 10:00 UTC (57 paths, lock +12/+15): fast share 80% -> 70%
# = +0.24 pts/token ([-0.10, +0.58]), 2 fewer premature sales, no extra loser; 75% gave +0.15; under 70% (code
# change) measured no further gain. 70 = same share as keep_pct: the speed part is neutral, not removed.
profit_lock_keep_fast_pct = 70.0
profit_lock_speed_full = 60.0
profit_lock_speed_seconds = 60.0
# WIDER STOP UNDER +50% (user's rule 2026-11-12: "up to +50% the stop must be further away: at +50% it is +25%;
# from +70/+80/+100% a stop close to the profit is fine, as now"). Under a net peak of profit_lock_keep_high_from_pct
# the stop keeps profit_lock_keep_low_pct of the peak (+20% -> +10%, +30% -> +15%, +50% -> +25%; never under the
# +4% floor, never going down); from that peak on it keeps profit_lock_keep_pct (fast: keep_fast) and the 6%
# trailing starts (trail_activate_pct = 50). Replay 2026-11-12 10:10 UTC, 57 paths, vs trailing 30/6 + 70%: approved
# tokens +0.9 pts/token, all tokens -0.8, both far inside the noise ([-6.3, +8.1] / [-4.5, +2.8]), one extra
# losing trade on all tokens; 60% under +50% gave +1.1 / +0.4. Only 10 of 57 paths peaked between +20% and +50%.
# 0 = band off.
profit_lock_keep_low_pct = 60.0   # 60: user 2026-11-12 after the replay above (+50% -> stop +30%)
profit_lock_keep_high_from_pct = 50.0
# PARTIAL SALE (user's rule 2026-11-12): when the position is up scale_out_at_pct NET (sale costs included, checked
# on a real Jupiter quote) sell scale_out_fraction_pct of the tokens, once; the rest stays open under the stops above
# (60% of the peak under +50%, then 70% and the 6% trailing). The trade is recorded whole when the rest is sold.
# Replay 2026-11-12 10:20 UTC (57 paths, current stops): 30% at +30% = -1.5 pts/token on all tokens ([-6.0, +3.0]),
# -5.9 on the 19 approved ([-18.4, +6.5]), same losing trades: it gives up part of the big runs in exchange for a
# surer profit on the ones that fall back. Not modelled in the Controller's replays. 0 = off.
# OFF: the user withdrew it on 2026-11-12 after the replay above (back to selling the whole position).
scale_out_at_pct = 0
scale_out_fraction_pct = 0
# Fee rule: the lock also waits until the NET profit is at least this many times the trade's round-trip fees
# (1 = "profit = 100% of the fees"). With today's fees (median 2.5%, max 3.1%) the +8% level decides; it only
# matters for an expensive token.
profit_lock_fee_multiple = 1.0

[devwatch]
# CREATOR SELLING (user's rule 2026-11-11, desk/devwatch.py): the token's creator and the wallets linked to it
# (RugCheck insider networks that contain the creator, the creator's funder when GMGN knows it) must not sell more
# than max_sold_pct of what they held from the start (the creator's own buy at launch, or the most the group was
# seen holding). Moves between wallets of the group are not sales. No position open -> the token is marked
# dangerous and dropped for good; position open -> sold at once, whatever the P&L. Balances are read on-chain.
enabled = true
max_sold_pct = 10.0
min_hold_pct = 0.1                 # the group held under 0.1% of the supply (dust): not judged
position_check_seconds = 20.0      # open positions: one RPC call per position this often
filter_check_seconds = 60.0        # tokens without a position: one RPC call per token at most this often
max_linked_wallets = 12

[recap]
interval_hours = 4

[live_gate]
# Live trading is refused until paper trading has proven itself.
min_paper_trades = 30
require_positive_paper_pnl = true
max_paper_drawdown_pct = 20.0

[quant]
# QUANT: trade only if expected value AFTER the measured round-trip cost is positive.
# Probabilities of "+12% first / -6% first / neither in 60 min" are learned from real trades
# and from following every evaluated token for 60 minutes (shadow tracking).
enabled = true
horizon_minutes = 60
min_samples_to_enforce = 30     # warm-up: log EV but don't block until this many outcomes exist
min_ev_pct = 0.0                # required edge in % (can only be >= 0)
prior_strength = 10.0
shadow_tracking = true          # follow every evaluated token (bought or skipped) for 60 min
shadow_weight = 0.5             # a skipped-token outcome counts half a real trade
shadow_min_liquidity_usd = 5000 # don't follow untradeable dust
default_cost_pct = 2.5          # assumed round-trip cost until real quotes have been measured
learn_since = "2026-11-10T09:03:00Z"  # QUANT learns only from trades/follow-ups after this (UTC): when the
                                # instant-rug protections went live. "" = all. Older rows stay in the database.
market_regime = true            # MEASUREMENT ONLY: store BTC / SOL / memecoin 1h & 24h moves with every
                                # shadow row and trade; `run.py research` compares outcomes by regime

[gmgn]
# Optional wallet intelligence from GMGN (paid OpenAPI, Plus plan or better).
# Active only when GMGN_API_KEY is set in .env. Read-only: GMGN never trades for this desk.
enabled = true
plan = "plus"                    # free | plus | pro  -> request budget
signal_feed = true               # Scout listens to smart-money & KOL buy signals
max_rug_ratio = 0.30             # GMGN rug label            -> permanent kill
max_insider_rate = 0.25          # suspected insider share   -> reject
max_bundler_rate = 0.30          # bundled-buy share         -> reject
max_sniper_rate = 0.30           # sniper share              -> reject
max_funding_cluster_pct = 15.0   # % supply held by wallets funded by the same wallet -> reject
serial_min_launches = 10         # dev with >= 10 launches and...
serial_max_graduation = 0.05     # ...<= 5% graduated -> permanent kill (and added to rug ledger)

[controller]
# CONTROLLORE: checks that the other agents behave (every health_seconds) and, every interval_minutes,
# replays different settings on the tokens the desk already followed for 60 minutes (no API calls, no trades).
# BASE RULE (user, 2026-11-11 23:31 UTC): the Controller only PROPOSES, the user decides. It never applies a change
# and never rolls one back by itself: every change it would make goes to the proposals summary (dashboard section
# "Controllore", report) and you choose whether to apply it. Decisions it applied before this rule stay recorded
# (controller_decisions table, kept forever) and keep being re-checked; if the data disproves one, going back is
# a proposal too. The values it applied then are in data/controller_overrides_<mode>.json, still loaded over this
# file until you decide on them. Report: data/reports/controller_<mode>_latest.md, `python run.py controller`.
enabled = true
interval_minutes = 10
health_seconds = 60
random_variants = 24      # new random combinations tried per agent each round (plus the best of earlier rounds)
min_rows = 30             # fewest tokens a situation needs before it is judged
holdout_pct = 30          # newest share of the data kept aside to verify the winner
lookback_days = 14
auto_apply = "off"        # always "off": proposals only (user rule 2026-11-11; any other value is refused)
confirm_rounds = 3        # rounds in a row a PROMETTENTE model verdict needs before the block is proposed/used
apply_cooldown_minutes = 60   # (unused while auto_apply is off)
review_min_rows = 30      # new tokens needed to confirm a past decision or propose rolling it back

[model]
# MODELLO: small statistical model (boosted trees, CPU, numpy) the Controller retrains every round on the 60-minute
# follow-ups. It estimates P(win) = chance that the current exit rules close a token in profit, from the numbers
# seen at decision time. Trained on the oldest 70%, judged on the newest 30% it never saw. It starts "in prova"
# (logs P(win), blocks nothing) and BLOCKS buys under its threshold only after a SOLIDA verdict (or PROMETTENTE for
# [controller] confirm_rounds rounds in a row) and only if YOU approved it with enforce = true; until then the
# Controller shows it as a proposal (rule 2026-11-11). Once approved it switches itself off when the advantage
# disappears. It can only block, never force a buy or loosen a rule. Data check: `python run.py model`.
enabled = true
enforce = false           # your approval for the block: false = the Controller only proposes it
min_rows = 1000           # Analyst follow-ups with stored values needed before the first training
min_leaf = 40
min_eval_rows = 30
max_block_pct = 40        # never block more than this share of the buys

[dashboard]
# Web dashboard (read-only) — opens in your browser at http://127.0.0.1:8080
enabled = true
port = 8080          # if busy, the next free port up to 8089 is used
open_browser = true

[pages]
# Public, read-only copy of the dashboard on GitHub Pages (https://<user>.github.io/<repo>/).
# The desk pushes a snapshot to the "gh-pages" branch every N minutes, in the background: if git or the
# network fail, the trading loop is not affected. ATTENTION: the page is PUBLIC (balances, trades, tokens).
enabled = true
interval_minutes = 10   # GitHub Pages accepts ~10 updates/hour: values below 6 are raised to 6
remote = ""             # empty = the "origin" remote of this folder (must be a git clone with push rights)
branch = "gh-pages"
publish_live = false    # in live mode publish only if true (trades are traceable to your wallet on-chain)
